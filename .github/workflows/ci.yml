name: Reproducibility checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff==0.9.10
      - name: Lint
        run: ruff check --output-format=github src tests
      - name: Check formatting
        run: ruff format --check src tests

  test-and-regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest
      - name: Regenerate deterministic artifacts
        run: >
          python -m src.phase_error_blind_spot
          --output experiments/phase_error_sweep.csv
          --figures .ci-artifacts/figures
          --table paper/generated/phase_error_results_table.tex
      - name: Regenerate finite-shot data
        run: >
          python -m src.finite_shot_phase_error
          --output experiments/finite_shot_sweep.csv
          --root-seed 20261030
      - name: Generate finite-shot figure
        run: >
          python -m src.finite_shot_figures
          --input experiments/finite_shot_sweep.csv
          --output .ci-artifacts/finite_shot_detectability.png
      - name: Verify deterministic data artifacts are committed
        run: git diff --exit-code -- experiments/phase_error_sweep.csv experiments/finite_shot_sweep.csv paper/generated/phase_error_results_table.tex

  compile-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile the paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
